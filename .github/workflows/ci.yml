name: CI

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  verificar:
    name: Typecheck e smoke test
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      # A CLI depende do type stripping nativo do Node, disponivel a partir do 22.18.
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - run: npm ci

      - name: Typecheck
        run: npm run check

      # Garante que os .ts realmente executam nesta versao do Node —
      # o tsc sozinho nao provaria isso.
      - name: Smoke test da CLI
        run: |
          npm run listar
          node src/cli.ts > /dev/null
