<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<!-- Fonte da imagem de compartilhamento (og:image).
     Para regerar depois de mudar o texto ou a paleta:
       npm run og
     A saida e site/compartilhamento.png, em 1200x630. -->
<link rel="stylesheet" href="../tokens.css">
<link rel="stylesheet" href="../fontes.css">
<style>
  * { margin: 0; box-sizing: border-box; }
  body {
    width: 1200px; height: 630px; overflow: hidden;
    background: var(--color-canvas); color: var(--color-tinta);
    font-family: var(--font-texto);
    display: grid; grid-template-columns: 1fr 340px; align-items: center;
    padding: 64px 72px; position: relative;
  }
  /* As mesmas manchas de luz do site, paradas. */
  .brilho { position: absolute; inset: -10%; filter: blur(130px); z-index: 0; }
  .brilho span { position: absolute; display: block; border-radius: 50%; }
  .brilho span:nth-child(1) { width: 520px; height: 520px; left: -80px; top: -180px; background: var(--color-greige); opacity: .8; }
  .brilho span:nth-child(2) { width: 420px; height: 420px; right: -60px; bottom: -160px; background: var(--color-areia); opacity: .5; }
  .texto { position: relative; z-index: 1; padding-right: 48px; }
  .marca {
    font-family: var(--font-display); font-size: 26px; color: var(--color-espresso);
    letter-spacing: .05em; margin-bottom: 36px;
    display: inline-flex; align-items: center; gap: 13px;
  }
  /* Mesmo simbolo do site, pela mesma mascara. */
  .marca .sinal {
    width: .72em; height: .94em; display: block;
    background: currentColor;
    -webkit-mask: url("../marca.svg") no-repeat center / contain;
    mask: url("../marca.svg") no-repeat center / contain;
  }
  h1 {
    font-family: var(--font-display); font-weight: 400;
    font-size: 62px; line-height: 1.06; letter-spacing: -.015em;
    color: var(--color-espresso); text-wrap: balance;
  }
  .filete { width: 140px; height: 1px; background: var(--color-areia); margin: 32px 0; position: relative; }
  .filete::after {
    content: ""; position: absolute; left: 50%; top: -3px; width: 6px; height: 6px;
    margin-left: -3px; background: var(--color-eucalipto); transform: rotate(45deg);
  }
  p { font-size: 25px; line-height: 1.45; color: var(--color-tinta); max-width: 24ch; }
  /* O trio de arcos do heroi, reduzido a duas molduras. */
  .arcos { position: relative; z-index: 1; display: flex; gap: 18px; align-items: flex-end; height: 100%; }
  .arco { flex: 1; background: var(--color-greige); border-radius: var(--radius-arco); }
  .arco:nth-child(1) { height: 78%; }
  .arco:nth-child(2) { height: 96%; background: var(--color-porcelana); }
</style>
</head>
<body>
  <div class="brilho"><span></span><span></span></div>
  <div class="texto">
    <div class="marca"><span class="sinal"></span>Intervalo</div>
    <h1>Você não precisa de mais clientes.</h1>
    <div class="filete"></div>
    <p>Precisa que as que você já tem não sumam.</p>
  </div>
  <div class="arcos"><div class="arco"></div><div class="arco"></div></div>
</body>
</html>
